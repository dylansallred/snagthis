name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch portable media tools
        run: |
          npm run fetch:ffmpeg --workspace @m3u8/desktop
          npm run fetch:yt-dlp --workspace @m3u8/desktop
      - name: Use the bundled tools for media fixtures
        shell: bash
        run: node -p "require('path').resolve('apps/desktop/bin')" >> "$GITHUB_PATH"
      - name: Lint, types, unit and media fixtures, production builds, token parity
        run: npm run verify
      - name: Install browser and Electron display dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser and desktop end-to-end checks
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=chromium
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
