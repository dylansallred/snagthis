name: Prepare corresponding source

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact desktop release tag (vX.Y.Z)
        required: true
      archive_url:
        description: HTTPS URL of the reviewed corresponding-source .tar.xz
        required: true
      archive_sha256:
        description: Reviewed SHA256 of the source archive
        required: true
      manifest_url:
        description: HTTPS URL of corresponding-source.json
        required: true
      manifest_sha256:
        description: Reviewed SHA256 of corresponding-source.json
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARCHIVE_URL: ${{ inputs.archive_url }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      MANIFEST_URL: ${{ inputs.manifest_url }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch exactly the source packet reviewed by the maintainer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-fA-F0-9]{64}$ && "$MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir -p release-assets/release-source
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 1800 --url "$ARCHIVE_URL" --output release-assets/release-source/vidsnag-corresponding-source.tar.xz
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --url "$MANIFEST_URL" --output release-assets/release-source/corresponding-source.json
          printf '%s  %s\n' "$ARCHIVE_SHA256" release-assets/release-source/vidsnag-corresponding-source.tar.xz "$MANIFEST_SHA256" release-assets/release-source/corresponding-source.json | sha256sum --check --strict
          GITHUB_REF_NAME="$RELEASE_TAG" node scripts/verify-corresponding-source.cjs release-assets --packet-only
      - name: Stage for exact binary-source matching and required release approval
        uses: actions/upload-artifact@v4
        with:
          name: vidsnag-corresponding-source
          path: |
            release-assets/release-source/vidsnag-corresponding-source.tar.xz
            release-assets/release-source/corresponding-source.json
          if-no-files-found: error
          retention-days: 30
