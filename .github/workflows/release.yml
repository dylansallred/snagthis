name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VIDSNAG_RELEASE: '1'
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require release credentials and matching package version
        shell: bash
        run: bash scripts/release-preflight.sh --target ${{ matrix.platform }}
      - run: npm ci
      - name: Fetch portable tools with license and source metadata
        run: |
          npm run fetch:ffmpeg --workspace @m3u8/desktop
          npm run fetch:yt-dlp --workspace @m3u8/desktop
      - name: Include project notices in the installed app
        shell: bash
        run: |
          cp LICENSE apps/desktop/bin/VIDSNAG-LICENSE.txt
          cp THIRD_PARTY_NOTICES.md apps/desktop/bin/THIRD_PARTY_NOTICES.md
      - name: Build signed installers without publishing
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            npm run dist --workspace @m3u8/desktop -- --mac --${{ matrix.arch }} --publish=never -c.forceCodeSigning=true -c.mac.notarize=true
          else
            npm run dist --workspace @m3u8/desktop -- --win --${{ matrix.arch }} --publish=never -c.forceCodeSigning=true
          fi
      - name: Notarize and staple the exact DMG to be shipped
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in apps/desktop/dist-electron/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > notarization.json
            node -e "if(require('./notarization.json').status!=='Accepted')process.exit(1)"
            xcrun stapler staple "$dmg"
          done
      - name: Install exact artifact, verify signature and run a real packaged download
        run: node scripts/verify-release.cjs
      - name: Stage validated artifacts privately within this workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe.blockmap
            apps/desktop/dist-electron/*.zip.blockmap
            apps/desktop/dist-electron/*.yml
            apps/desktop/dist-electron/release-verification-*.json
          if-no-files-found: error
          retention-days: 7

  extension:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Include GPL license and package the extension
        run: |
          cp LICENSE apps/extension/LICENSE
          cp THIRD_PARTY_NOTICES.md apps/extension/THIRD_PARTY_NOTICES.md
          npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: vidsnag-extension.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [checks, desktop, extension]
    runs-on: ubuntu-latest
    # Required reviewers must verify all linked GPL dependency sources before approval.
    environment: release-approval
    permissions:
      contents: write
      actions: read
    env:
      CORRESPONDING_SOURCE_RUN_ID: ${{ vars.CORRESPONDING_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false
      - name: Require a protected manual release environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          protected="$(gh api "repos/$GITHUB_REPOSITORY/environments/release-approval" --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))')"
          [[ "$protected" == true ]] || { echo 'Configure required reviewers on release-approval; automatic publication is disabled.'; exit 1; }
      - name: Require an explicitly prepared source packet
        shell: bash
        run: |
          [[ "$CORRESPONDING_SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Set CORRESPONDING_SOURCE_RUN_ID to the reviewed source-artifact workflow run; publication is blocked without it.'; exit 1; }
      - name: Download the reviewed corresponding-source artifact
        uses: actions/download-artifact@v4
        with:
          name: vidsnag-corresponding-source
          path: release-assets/release-source
          run-id: ${{ vars.CORRESPONDING_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate corresponding source and assemble the release payload
        run: node scripts/release-assets.cjs release-assets
      - name: Upload the verified desktop and extension to a release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/publish/*
            LICENSE
            THIRD_PARTY_NOTICES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after every verified asset is attached
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
