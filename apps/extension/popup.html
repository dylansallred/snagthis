<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VidSnag</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup">
    <header class="popup-header"><img src="img/vidsnag-logo-mark.png" alt="VidSnag" class="logo-mark"><span id="page-count">No videos yet</span></header>
    <div id="connection-banner" class="connection-banner" role="status" hidden></div>
    <div id="video-list" class="video-list" aria-label="Videos on this page"></div>
    <footer class="popup-footer">
      <button type="button" class="action" id="settings-button" aria-label="Settings"></button>
      <button type="button" class="action" id="help-button">No video?</button>
      <span class="spacer"></span>
      <button type="button" class="action" id="open-app">Open VidSnag <span id="active-count" class="count-badge" hidden></span></button>
    </footer>
  </main>
  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="sheet" class="sheet"><header class="sheet-header"><h2 id="sheet-title"></h2><button type="button" class="action" id="close-sheet" aria-label="Close"></button></header><div id="sheet-content" class="sheet-content"></div></dialog>
  <div id="notice" class="notice" role="status" hidden></div>
  <script src="shared/strings.js"></script>
  <script src="shared/rows.js"></script>
  <script src="shared/hls.js"></script>
  <script src="shared/selection.js"></script>
  <script src="js/detection.js"></script>
  <script src="popup/titles.js"></script>
  <script src="popup/model.js"></script>
  <script src="popup/demo.js"></script>
  <script src="popup.js"></script>
</body>
</html>
