<!doctype html>

<head>

  <style>
    @font-face{font-family:Inter;src:url('../../../../../apps/extension/fonts/inter-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#101216;color:#ebe8e2;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;width:400px;--progress:42%;font-size:13px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,.video-row:focus-visible{outline:2px solid #d1a477;outline-offset:-3px}button{border:0;background:none}button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
    .popup{width:400px;background:#101216;overflow:hidden}.header{height:48px;display:flex;align-items:center;gap:9px;padding:0 15px;border-bottom:1px solid #ffffff09}.mark{width:20px;height:20px;display:grid;place-items:center;color:#ce9870}.mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.brand{font-size:13px;font-weight:650;letter-spacing:-.3px}.page-count{margin-left:auto;font-size:11px;color:#72777d}.video-row{isolation:isolate;position:relative;display:flex;align-items:center;gap:12px;min-height:112px;padding:15px 14px;border-bottom:1px solid #ffffff08;overflow:hidden;background:#111419;--progress:42%}.video-row:focus{outline-offset:-2px}.video-row:hover{background:#14171c}.underlight{position:absolute;z-index:-1;inset:0;overflow:hidden;pointer-events:none}.current-field{position:absolute;left:0;bottom:0;width:var(--progress);height:100%;border-radius:0 80px 12px 0;overflow:hidden;transition:width 450ms cubic-bezier(.2,.7,.2,1);background:radial-gradient(ellipse at 91% 112%,#d3a27520,transparent 60%)}.current-field::before{content:'';position:absolute;width:220%;height:84px;left:-90%;bottom:-41px;border-radius:50%;transform:rotate(-9deg);background:linear-gradient(165deg,transparent 30%,#bc71421f 47%,#d1a27338 58%,#bd7d4423 75%,transparent);filter:blur(8px);animation:current-drift 7s ease-in-out infinite alternate}.current-field::after{content:'';position:absolute;inset:auto -25% -40px 1%;height:75px;border-radius:50%;background:radial-gradient(ellipse at 70% 20%,#e0b57930,transparent 68%);transform:rotate(7deg);filter:blur(6px);animation:current-return 9s ease-in-out infinite alternate}.current-ribbon{position:absolute;width:100%;height:68px;left:0;bottom:-34px;border:1px solid #dfa96e25;border-radius:50%;transform:rotate(-7deg);filter:blur(.3px);animation:ribbon-breathe 7s ease-in-out infinite alternate}.underlight::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:1px;background:linear-gradient(90deg,#c18b5238,transparent 86%);opacity:.75}.video-row[data-state='paused'] .current-field{opacity:.36;filter:saturate(.35)}.video-row[data-state='saved'] .underlight{display:none}.video-row[data-state='paused'] .current-field::before,.video-row[data-state='paused'] .current-field::after,.video-row[data-state='paused'] .current-ribbon,.video-row[data-motion='false'] .current-field::before,.video-row[data-motion='false'] .current-field::after,.video-row[data-motion='false'] .current-ribbon{animation:none}.video-row[data-state='paused'] .underlight::after{opacity:.3}
    .thumb{position:relative;flex:none;width:144px;height:81px;overflow:hidden;border-radius:7px;background:#22262b;box-shadow:0 0 0 1px #ffffff08}.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.thumb video{opacity:0;pointer-events:none}.thumb.is-playing video{opacity:1}.row-body{min-width:0;flex:1;align-self:center}.row-title{margin:0 0 7px;font-size:13px;font-weight:580;letter-spacing:-.19px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metadata{display:flex;align-items:center;gap:6px;color:#83888d;font-size:10px;line-height:13px;white-space:nowrap;font-variant-numeric:tabular-nums}.divider{width:1px;height:9px;background:#45494d;flex:none}.row-status{margin-top:11px;display:flex;align-items:center;gap:6px;white-space:nowrap;line-height:16px;color:#a19b93;font-size:11px;font-variant-numeric:tabular-nums}.percent{color:#d2ae88;font-size:12px;font-weight:570}.status-dot{width:3px;height:3px;flex:none;border-radius:50%;background:#78736b}.video-row[data-state='paused'] .percent{color:#a19c95}.video-row[data-state='saved'] .row-status{color:#929f92}.saved-check{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}.row-action{height:28px;width:28px;flex:none;display:grid;place-items:center;border:1px solid #ffffff0d;border-radius:50%;color:#a6a4a1;background:#181c20b8}.row-action:hover{color:#e6c4a1;background:#292723;border-color:#b383523b}.footer{height:43px;display:flex;align-items:center;padding:0 12px;gap:4px;color:#898d92}.footer button{height:28px;border-radius:5px;font-size:11px;display:flex;align-items:center;gap:6px;padding:0 7px}.footer button:hover{background:#ffffff07;color:#d6d3ce}.footer .open{margin-left:auto;color:#a4a6a9}.footer .open svg{width:12px;height:12px}.connection{width:4px;height:4px;border-radius:50%;background:#819680;margin-right:2px}.footer .settings{padding:0 5px}
    @keyframes current-drift{from{transform:translateX(-9%) translateY(2px) rotate(-12deg);opacity:.65}to{transform:translateX(16%) translateY(-7px) rotate(-4deg);opacity:1}}
    @keyframes current-return{from{transform:translateX(6%) rotate(9deg);opacity:.45}to{transform:translateX(-14%) rotate(-1deg);opacity:.9}}
    @keyframes ribbon-breathe{from{transform:translateY(4px) rotate(-9deg);opacity:.2}to{transform:translateY(-3px) rotate(-4deg);opacity:.65}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.current-ribbon{opacity:.3}.thumb video{display:none}}
  </style>
</head>
<body data-progress="42" data-state="downloading" data-motion="true">
  <main class="popup" aria-label="VidSnag download concept Current">
    <header class="header"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12v13l-6 4-6-4zM12 7v8m-3-3 3 3 3-3"/></svg></span><span class="brand">VidSnag</span><span class="page-count">3 videos on this page</span></header>
    <section aria-label="Videos">
      <article id="featured-row" class="video-row" tabindex="0" data-progress="42" data-state="downloading" data-motion="true" aria-label="Sintel">
        <div class="underlight" aria-hidden="true"><div class="current-field"><div class="current-ribbon"></div></div></div>
        <div class="thumb"><img src="../../../../../apps/extension/popup/media/sintel.jpg" alt=""><video data-src="../../../../../apps/extension/popup/media/sintel.mp4" muted playsinline loop preload="none" aria-hidden="true"></video></div>
        <div class="row-body"><h2 class="row-title" title="Sintel — A Blender Open Movie">Sintel — A Blender Open Movie</h2><div class="metadata"><span>1080p</span><span class="divider" aria-hidden="true"></span><span>5.1 GB</span><span class="divider" aria-hidden="true"></span><span>1:58:43</span></div><div class="row-status" role="progressbar" aria-label="Sintel download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><span class="percent">42%</span><span class="status-dot" aria-hidden="true"></span><span class="state-label">Downloading</span></div></div>
        <button class="row-action" aria-label="Pause download" title="Pause download"><svg viewBox="0 0 20 20"><path d="M7 5v10M13 5v10"/></svg></button>
      </article>
      <article class="video-row" tabindex="0" data-state="paused" data-progress="68" data-motion="false" style="--progress:68%" aria-label="Big Buck Bunny">
        <div class="underlight" aria-hidden="true"><div class="current-field"><div class="current-ribbon"></div></div></div>
        <div class="thumb"><img src="../../../../../apps/extension/popup/media/big-buck-bunny.jpg" alt=""><video data-src="../../../../../apps/extension/popup/media/big-buck-bunny.mp4" muted playsinline loop preload="none" aria-hidden="true"></video></div>
        <div class="row-body"><h2 class="row-title">Big Buck Bunny</h2><div class="metadata"><span>1080p</span><span class="divider" aria-hidden="true"></span><span>842 MB</span><span class="divider" aria-hidden="true"></span><span>9:56</span></div><div class="row-status" role="progressbar" aria-label="Big Buck Bunny download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><span class="percent">68%</span><span class="status-dot" aria-hidden="true"></span><span class="state-label">Paused</span></div></div>
        <button class="row-action" aria-label="Resume download" title="Resume download"><svg viewBox="0 0 20 20"><path d="m7 5 7 5-7 5z"/></svg></button>
      </article>
      <article class="video-row" tabindex="0" data-state="saved" data-progress="100" data-motion="false" aria-label="Tears of Steel">
        <div class="thumb"><img src="../../../../../apps/extension/popup/media/tears-of-steel.jpg" alt=""><video data-src="../../../../../apps/extension/popup/media/tears-of-steel.mp4" muted playsinline loop preload="none" aria-hidden="true"></video></div>
        <div class="row-body"><h2 class="row-title">Tears of Steel</h2><div class="metadata"><span>1080p</span><span class="divider" aria-hidden="true"></span><span>1.2 GB</span><span class="divider" aria-hidden="true"></span><span>12:14</span></div><div class="row-status"><svg class="saved-check" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg><span>Saved</span></div></div>
        <button class="row-action" aria-label="Play Tears of Steel" title="Play Tears of Steel"><svg viewBox="0 0 20 20"><path d="m7 5 7 5-7 5z"/></svg></button>
      </article>
    </section>
    <footer class="footer"><button class="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="m9.7 4 .5-2h3.6l.5 2 1.5.9 2-.6 1.8 3.1-1.5 1.4v1.8l1.5 1.4-1.8 3.1-2-.6-1.5.9-.5 2h-3.6l-.5-2-1.5-.9-2 .6-1.8-3.1 1.5-1.4V8.8L4.4 7.4l1.8-3.1 2 .6z" transform="translate(0 2)"/><circle cx="12" cy="12" r="2.5"/></svg></button><button>Missing a video?</button><button class="open"><span class="connection" aria-hidden="true"></span>Open VidSnag<svg viewBox="0 0 20 20"><path d="M6 14 14 6M6 6h8v8"/></svg></button></footer>
  </main>
  <script>
    const featured = document.getElementById('featured-row');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let current = { progress: 42, state: 'downloading', motion: true };
    const playIcon = '<svg viewBox="0 0 20 20"><path d="m7 5 7 5-7 5z"/></svg>';
    const pauseIcon = '<svg viewBox="0 0 20 20"><path d="M7 5v10M13 5v10"/></svg>';
    function applyState(next) {
      const numeric = Number(next.progress);
      current = { progress: Number.isFinite(numeric) ? Math.max(0, Math.min(100, numeric)) : current.progress, state: ['downloading', 'paused', 'saved'].includes(next.state) ? next.state : current.state, motion: typeof next.motion === 'boolean' ? next.motion : current.motion };
      for (const node of [document.body, featured]) { node.dataset.progress = String(current.progress); node.dataset.state = current.state; node.dataset.motion = String(current.motion); node.style.setProperty('--progress', `${current.progress}%`); }
      const status = featured.querySelector('.row-status');
      status.setAttribute('aria-valuenow', String(current.progress));
      status.setAttribute('aria-valuetext', current.state === 'saved' ? 'Saved' : `${Math.round(current.progress)}% ${current.state}`);
      status.querySelector('.percent').textContent = current.state === 'saved' ? '✓' : `${Math.round(current.progress)}%`;
      status.querySelector('.state-label').textContent = current.state === 'downloading' ? 'Downloading' : current.state === 'paused' ? 'Paused' : 'Saved';
      status.querySelector('.status-dot').hidden = current.state === 'saved';
      const action = featured.querySelector('.row-action');
      const label = current.state === 'downloading' ? 'Pause download' : current.state === 'paused' ? 'Resume download' : 'Play Sintel';
      action.setAttribute('aria-label', label); action.title = label; action.innerHTML = current.state === 'downloading' ? pauseIcon : playIcon;
      for (const row of document.querySelectorAll('.video-row')) syncPreview(row);
    }
    function syncPreview(row) {
      const video = row.querySelector('video');
      const active = (row.matches(':hover') || row.contains(document.activeElement)) && !document.hidden && !reducedMotion.matches && current.motion;
      if (active) {
        if (!video.getAttribute('src')) { video.muted = true; video.src = video.dataset.src; }
        video.play().catch(() => {});
      } else { video.pause(); row.querySelector('.thumb').classList.remove('is-playing'); if (video.getAttribute('src')) { video.removeAttribute('src'); video.load(); } }
    }
    for (const row of document.querySelectorAll('.video-row')) {
      row.addEventListener('pointerenter', () => syncPreview(row)); row.addEventListener('pointerleave', () => syncPreview(row));
      row.addEventListener('focusin', () => syncPreview(row)); row.addEventListener('focusout', () => queueMicrotask(() => syncPreview(row)));
      row.querySelector('video').addEventListener('playing', () => row.querySelector('.thumb').classList.add('is-playing'));
      row.querySelector('video').addEventListener('error', () => row.querySelector('.thumb').classList.remove('is-playing'));
    }
    featured.querySelector('.row-action').addEventListener('click', () => { if (current.state !== 'saved') applyState({ ...current, state: current.state === 'paused' ? 'downloading' : 'paused' }); });
    window.addEventListener('message', event => { if (event.data && event.data.type === 'vidsnag-design-state') applyState(event.data); });
    document.addEventListener('visibilitychange', () => document.querySelectorAll('.video-row').forEach(syncPreview));
    window.addEventListener('blur', () => { for (const video of document.querySelectorAll('video')) { video.pause(); video.closest('.thumb').classList.remove('is-playing'); } });
    reducedMotion.addEventListener('change', () => document.querySelectorAll('.video-row').forEach(syncPreview));
    applyState(current);
  </script>
</body>
</html>
