<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VidSnag · Shelf</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark;background:#101216}body{margin:0;width:400px;max-width:100vw;height:560px;max-height:100dvh;background:#101216;color:#ede9e5;font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:2px solid #f47b42;outline-offset:3px}svg{display:block;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}header{height:49px;min-height:49px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202228}header img{width:105px;height:auto}header span{font-size:11px;color:#919196}.shelves{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}.shelf{position:relative;border:1px solid #2b2d34;border-radius:12px;background:#181b20;overflow:hidden;flex:none}.shelf.featured{background:#1c1e24;border-color:#393b43}.cover-row{display:grid;grid-template-columns:148px minmax(0,1fr);gap:13px;padding:12px}.thumb{position:relative;width:148px;height:83px;overflow:hidden;border-radius:7px;background:#0d0f12;padding:0;display:block}.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.thumb video{opacity:0;transition:opacity .16s}.thumb.playing video{opacity:1}.identity{min-width:0;padding-top:3px;position:relative}.identity h2{font-size:14px;font-weight:610;letter-spacing:-.015em;line-height:1.4;margin:0 21px 5px 0}.identity p{font-size:11px;color:#9999a1;margin:0}.identity .metadata{margin-top:15px;color:#777a84;font-size:11px}.more{position:absolute;right:-5px;top:-3px;width:25px;height:25px;display:grid;place-items:center;color:#999aa0;border-radius:5px}.more:hover{background:#303239}.more svg{width:16px;height:16px}.save-state{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 10px 14px}.amount{font-size:14px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.amount span{font-size:11px;font-weight:400;color:#8d8e97;letter-spacing:0}.timing{font-size:11px;color:#9a9ba3;margin-top:1px}.state-actions{display:flex;align-items:center;gap:9px}.percentage{color:#cbcbd1;font:550 12px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}.ring-action{position:relative;width:42px;height:42px;border-radius:50%;background:#26282f;display:grid;place-items:center}.ring-action:hover{background:#32353d}.ring-progress{position:absolute;inset:0;width:42px;height:42px;transform:rotate(-90deg);stroke-width:2.7}.ring-track{stroke:#454750}.ring-value{stroke:#eb6b30;stroke-dasharray:113.1;stroke-dashoffset:calc(113.1 * (1 - var(--progress, .42)));transition:stroke-dashoffset .35s ease}.action-symbol{height:16px;width:16px;stroke-width:1.8}.shelf-progress{height:7px;background:#303239;overflow:hidden}.shelf-progress>i{display:block;width:var(--p,42%);height:100%;background:#e46328;transition:width .35s ease}.featured[data-state="paused"] .shelf-progress>i,.featured[data-state="paused"] .ring-value{background:#92929b;stroke:#adadb6}.featured[data-state="saved"] .shelf-progress>i{background:#568a72}.featured[data-state="saved"] .ring-value{stroke:#72a78e}.featured[data-state="saved"] .percentage{display:none}.compact .cover-row{padding-bottom:10px}.compact .identity h2{font-size:13px;margin-bottom:5px}.compact .identity .metadata{margin-top:8px}.compact .thumb{width:132px;height:74px}.compact .cover-row{grid-template-columns:132px minmax(0,1fr);gap:13px;padding:11px}.mini-state{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:6px;color:#a3a4ab;font-size:11px}.mini-state .saved-word{color:#9ab5a6}.small-action{width:27px;height:27px;display:grid;place-items:center;border:1px solid #45464e;border-radius:7px;color:#e4e3e3}.small-action:hover{background:#2f323a}.small-action svg{width:13px;height:13px}.download-action{border-color:#ad4b21;color:#fb9564;background:#30231f}.download-action:hover{background:#422a21}.footer{height:46px;min-height:46px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #272930;padding:0 13px;background:#121419}.footer button{border-radius:6px;padding:5px;color:#9d9da4;font-size:11px}.footer button:hover{color:#f1ece6;background:#24262e}.footer-left{display:flex;align-items:center;gap:8px}.footer-left svg{width:16px;height:16px}.open-app{display:flex;align-items:center;gap:7px}.open-app svg{width:13px;height:13px}.notice{position:fixed;bottom:55px;left:19px;right:19px;padding:10px 12px;border:1px solid #3e414a;background:#282b33;color:#e0dde0;border-radius:8px;box-shadow:0 8px 20px #0005;font-size:12px;z-index:3}.notice[hidden]{display:none}body[data-motion="false"] *{transition:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-progress="42" data-state="downloading" data-motion="true">
<header><img src="/apps/extension/img/vidsnag-logo-title.png" alt="VidSnag"><span>3 videos on this page</span></header>
<main class="shelves" aria-label="Videos on this page">
  <article class="shelf featured" id="featured" data-progress="42" data-state="downloading" style="--p:42%;--progress:.42">
    <div class="cover-row">
      <button class="thumb" aria-label="Preview Sintel" data-video="sintel">
        <img src="/apps/extension/popup/media/sintel.jpg" alt="">
        <video src="/apps/extension/popup/media/sintel.mp4" poster="/apps/extension/popup/media/sintel.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
      </button>
      <div class="identity"><h2>Sintel</h2><p>Blender Open Movie</p><p class="metadata">14:48 · 1080p</p><button class="more" aria-label="More options for Sintel"><svg viewBox="0 0 20 20"><circle cx="4" cy="10" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></button></div>
    </div>
    <div class="save-state">
      <div><div class="amount"><strong id="amount">78 MB</strong> <span id="amount-suffix">of 186 MB</span></div><div class="timing" id="status">Saving · 2 min left</div></div>
      <div class="state-actions"><span class="percentage" id="percentage">42%</span><button class="ring-action" id="primary-action" aria-label="Pause download"><svg class="ring-progress" viewBox="0 0 42 42" aria-hidden="true"><circle class="ring-track" cx="21" cy="21" r="18"/><circle class="ring-value" cx="21" cy="21" r="18"/></svg><svg class="action-symbol" id="action-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg></button></div>
    </div>
    <div class="shelf-progress" id="progress-meter" role="progressbar" aria-label="Sintel download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><i></i></div>
  </article>
  <article class="shelf compact">
    <div class="cover-row">
      <button class="thumb" aria-label="Preview Tears of Steel" data-video="tears-of-steel"><img src="/apps/extension/popup/media/tears-of-steel.jpg" alt=""><video src="/apps/extension/popup/media/tears-of-steel.mp4" poster="/apps/extension/popup/media/tears-of-steel.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></button>
      <div class="identity"><h2>Tears of Steel</h2><p>Blender Open Movie</p><div class="mini-state"><span class="saved-word">Saved · 148 MB</span><button class="small-action" aria-label="Play Tears of Steel" data-play="tears-of-steel"><svg viewBox="0 0 20 20"><path d="m7 4 9 6-9 6Z"/></svg></button></div></div>
    </div>
  </article>
  <article class="shelf compact">
    <div class="cover-row">
      <button class="thumb" aria-label="Preview Big Buck Bunny" data-video="big-buck-bunny"><img src="/apps/extension/popup/media/big-buck-bunny.jpg" alt=""><video src="/apps/extension/popup/media/big-buck-bunny.mp4" poster="/apps/extension/popup/media/big-buck-bunny.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video></button>
      <div class="identity"><h2>Big Buck Bunny</h2><p>Blender Open Movie</p><div class="mini-state"><span id="bunny-status">1080p · 94 MB</span><button class="small-action download-action" id="bunny-download" aria-label="Download Big Buck Bunny"><svg viewBox="0 0 20 20"><path d="M10 3v10m-4-4 4 4 4-4M4 14v3h12v-3"/></svg></button></div></div>
    </div>
  </article>
</main>
<footer class="footer"><div class="footer-left"><button aria-label="Settings" data-notice="Settings stay one step away in a compact sheet."><svg viewBox="0 0 20 20"><path d="m8 2-.5 2-2 .9-1.8-.6-1.8 3.1 1.4 1.5v2.2l-1.4 1.5 1.8 3.1 1.8-.6 2 .9.5 2h4l.5-2 2-.9 1.8.6 1.8-3.1-1.4-1.5V8.9l1.4-1.5-1.8-3.1-1.8.6-2-.9L12 2Z"/><circle cx="10" cy="10" r="3"/></svg></button><button data-notice="Press play on a video, then open VidSnag again.">No video?</button></div><button class="open-app" data-notice="The desktop app would open here.">Open VidSnag<svg viewBox="0 0 20 20"><path d="M5 15 15 5M6 5h9v9"/></svg></button></footer>
<div class="notice" role="status" hidden></div>
<script>
(() => {
  const featured = document.getElementById('featured');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let current = { progress: 42, state: 'downloading', motion: true };
  let noticeTimer;
  const notice = message => {
    const element = document.querySelector('.notice');
    element.textContent = message;
    element.hidden = false;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { element.hidden = true; }, 2600);
  };
  const stopPreview = thumb => { thumb.querySelector('video').pause(); thumb.classList.remove('playing'); };
  const playPreview = async (thumb, explicit = false) => {
    if (!explicit && (!current.motion || reduced.matches)) return;
    try { await thumb.querySelector('video').play(); thumb.classList.add('playing'); } catch { /* Keep the real poster if playback is unavailable. */ }
  };
  function render(next) {
    current = { ...current, ...next };
    current.progress = Math.max(0, Math.min(100, Number.isFinite(Number(current.progress)) ? Number(current.progress) : 0));
    if (!['downloading', 'paused', 'saved'].includes(current.state)) current.state = 'downloading';
    if (current.state === 'saved') current.progress = 100;
    const pct = Math.floor(current.progress);
    for (const element of [document.body, featured]) { element.dataset.progress = String(pct); element.dataset.state = current.state; }
    document.body.dataset.motion = String(current.motion && !reduced.matches);
    featured.style.setProperty('--p', `${current.progress}%`);
    featured.style.setProperty('--progress', String(current.progress / 100));
    const saved = current.state === 'saved';
    document.getElementById('amount').textContent = `${Math.round(186 * current.progress / 100)} MB`;
    document.getElementById('amount-suffix').textContent = saved ? 'saved to your computer' : 'of 186 MB';
    document.getElementById('percentage').textContent = `${pct}%`;
    document.getElementById('status').textContent = saved ? 'Ready to watch' : current.state === 'paused' ? 'Paused · continue when you’re ready' : pct >= 100 ? 'Finishing up…' : `Saving · ${Math.max(1, Math.ceil((100 - pct) / 30))} min left`;
    document.getElementById('progress-meter').setAttribute('aria-valuenow', String(pct));
    document.getElementById('progress-meter').setAttribute('aria-valuetext', saved ? 'Saved' : `${pct} percent, ${current.state}`);
    document.getElementById('primary-action').setAttribute('aria-label', saved ? 'Play Sintel' : current.state === 'paused' ? 'Resume download' : 'Pause download');
    document.getElementById('action-symbol').innerHTML = saved || current.state === 'paused' ? '<path d="m7 4 9 6-9 6Z"/>' : '<path d="M7 5v10M13 5v10"/>';
    if (!current.motion || reduced.matches) document.querySelectorAll('.thumb').forEach(stopPreview);
  }
  window.addEventListener('message', event => {
    if (event.data?.type !== 'vidsnag-design-state') return;
    const update = {};
    if (event.data.progress !== undefined) update.progress = event.data.progress;
    if (event.data.state !== undefined) update.state = event.data.state;
    if (event.data.motion !== undefined) update.motion = Boolean(event.data.motion);
    render(update);
  });
  document.getElementById('primary-action').addEventListener('click', () => {
    if (current.state === 'saved') { playPreview(document.querySelector('[data-video="sintel"]'), true); return; }
    render({ state: current.state === 'paused' ? 'downloading' : 'paused' });
  });
  document.querySelectorAll('.thumb').forEach(thumb => {
    thumb.addEventListener('mouseenter', () => playPreview(thumb));
    thumb.addEventListener('focus', () => playPreview(thumb));
    thumb.addEventListener('mouseleave', () => stopPreview(thumb));
    thumb.addEventListener('blur', () => stopPreview(thumb));
    thumb.addEventListener('click', () => thumb.classList.contains('playing') ? stopPreview(thumb) : playPreview(thumb, true));
  });
  document.querySelectorAll('[data-play]').forEach(button => button.addEventListener('click', () => playPreview(document.querySelector(`[data-video="${button.dataset.play}"]`), true)));
  document.querySelectorAll('[data-notice]').forEach(button => button.addEventListener('click', () => notice(button.dataset.notice)));
  document.querySelector('.more').addEventListener('click', () => notice('Rename · Open page · Cancel download'));
  document.getElementById('bunny-download').addEventListener('click', event => { document.getElementById('bunny-status').textContent = 'Waiting · starts next'; event.currentTarget.hidden = true; });
  reduced.addEventListener('change', () => render({}));
  render(current);
})();
</script>
</body>
</html>
