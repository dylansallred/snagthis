<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidSnag · Signal</title>
  <style>
    @font-face { font-family:Inter; font-style:normal; font-weight:100 900; font-display:swap; src:url('/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
    :root { color-scheme:dark; --surface:hsl(222 14% 8%); --hover:hsl(222 12% 11%); --active:hsl(222 12% 15%); --border:hsl(221 8% 16%); --text:hsl(20 20% 93%); --muted:hsl(20 6% 60%); --subtle:hsl(20 5% 44%); --orange:hsl(20 88% 56%); --saved:hsl(145 44% 67%); }
    * { box-sizing:border-box; }
    html,body { margin:0; background:transparent; }
    body { color:var(--text); font:12px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
    .popup { width:400px; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .header { display:flex; align-items:center; gap:9px; padding:13px 14px; border-bottom:1px solid var(--border); color:var(--muted); }
    .logo { width:18px; height:18px; object-fit:contain; }
    .header strong { color:var(--text); font-size:13px; font-weight:570; letter-spacing:-.25px; }
    .header span { margin-left:auto; font-size:11px; color:var(--subtle); }
    .video-row { position:relative; display:flex; align-items:center; gap:12px; padding:15px 12px 17px; min-height:112px; }
    .video-row + .video-row { border-top:1px solid hsl(221 8% 13%); }
    .video-row:hover,.video-row:focus-within { background:var(--hover); }
    .preview { position:relative; display:block; width:144px; height:81px; flex:none; margin:0; padding:0; border:0; border-radius:6px; overflow:hidden; background:hsl(222 16% 6%); }
    .preview img,.preview video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
    .preview video { opacity:0; }
    .preview.is-playing video { opacity:1; }
    .copy { flex:1; min-width:0; }
    .title-line { display:flex; align-items:center; gap:5px; margin-bottom:5px; }
    h2 { flex:1; margin:0; font-size:13.5px; font-weight:570; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .action { display:grid; place-items:center; flex:none; width:26px; height:26px; border:0; padding:5px; border-radius:6px; background:transparent; color:var(--muted); }
    .action:hover { background:var(--active); color:var(--text); }
    .action svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .metadata { display:flex; align-items:center; gap:7px; color:var(--subtle); font-size:10.5px; white-space:nowrap; }
    .quality { color:var(--muted); }
    .duration { margin-left:auto; font:500 10px/1.4 "SF Mono",Consolas,monospace; letter-spacing:-.15px; }
    .status { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin-top:9px; white-space:nowrap; }
    .status strong { font-weight:500; color:var(--text); font-variant-numeric:tabular-nums; }
    .status .eta { color:var(--subtle); overflow:hidden; text-overflow:ellipsis; }
    .saved-mark { display:inline-flex; align-items:center; gap:4px; color:var(--saved); }
    .saved-mark svg { width:12px; height:12px; stroke:currentColor; stroke-width:1.8; fill:none; }
    .rail { position:absolute; left:12px; right:12px; bottom:0; height:2px; background:hsl(222 10% 19%); overflow:hidden; }
    .rail-fill { position:relative; height:100%; width:var(--progress,42%); background:hsl(20 70% 45%); overflow:hidden; transition:width 180ms linear; }
    .rail-fill::after { content:""; position:absolute; top:0; bottom:0; width:24px; left:-24px; background:linear-gradient(90deg,transparent,hsl(28 100% 83%),transparent); animation:signal-travel 2.7s ease-in-out infinite; }
    .video-row[data-state="paused"] .rail-fill { background:hsl(20 18% 45%); }
    .video-row[data-state="paused"] .rail-fill::after,.video-row[data-motion="false"] .rail-fill::after { display:none; }
    .video-row[data-state="saved"] .rail { display:none; }
    .video-row[data-motion="false"] .rail-fill { transition:none; }
    @keyframes signal-travel { 0%,12% { left:-24px; opacity:0; } 22% { opacity:1; } 75% { opacity:1; } 100% { left:100%; opacity:0; } }
    .footer { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding:8px 10px; }
    .footer-left { display:flex; align-items:center; gap:9px; color:var(--subtle); font-size:10.5px; }
    .footer-button { display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:4px; border:0; background:transparent; color:var(--muted); font-size:11px; }
    .footer-button:hover { color:var(--text); }
    .footer-button svg { width:12px; height:12px; stroke:currentColor; stroke-width:1.7; fill:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(prefers-reduced-motion:reduce) { .rail-fill { transition:none; } .rail-fill::after { display:none; } }
    @media(max-width:360px) { .video-row { gap:9px; padding-left:10px; padding-right:10px; } .metadata { gap:5px; font-size:10px; } .duration { font-size:9.5px; } h2 { font-size:13px; } .status { font-size:10.5px; } }
  </style>
</head>
<body data-progress="42" data-state="downloading" data-motion="true">
  <main class="popup" aria-label="VidSnag Signal extension concept">
    <header class="header"><img class="logo" src="/apps/desktop/src/assets/vidsnag-logo-mark.png" alt=""><strong>VidSnag</strong><span>3 videos on this page</span></header>
    <section aria-label="Videos">
      <article class="video-row" id="featured" data-progress="42" data-state="downloading" data-motion="true" style="--progress:42%">
        <button class="preview" type="button" aria-label="Preview Sintel"><img src="/apps/extension/popup/media/sintel.jpg" alt="Sintel"><video muted loop playsinline preload="none" data-src="/apps/extension/popup/media/sintel.mp4" aria-hidden="true"></video></button>
        <div class="copy"><div class="title-line"><h2>Sintel</h2><button class="action" id="featured-action" type="button" aria-label="Pause download" title="Pause download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg></button></div><div class="metadata"><span class="quality">1080p</span><span>2.1 GB</span><span class="duration">14:48</span></div><div class="status" id="featured-status"><strong>42%</strong><span class="eta">· 3 min left</span></div></div>
        <div class="rail" role="progressbar" aria-label="Sintel download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42" aria-valuetext="42 percent, 3 minutes left"><div class="rail-fill"></div></div>
      </article>
      <article class="video-row" data-state="saved">
        <button class="preview" type="button" aria-label="Preview Tears of Steel"><img src="/apps/extension/popup/media/tears-of-steel.jpg" alt="Tears of Steel"><video muted loop playsinline preload="none" data-src="/apps/extension/popup/media/tears-of-steel.mp4" aria-hidden="true"></video></button>
        <div class="copy"><div class="title-line"><h2>Tears of Steel</h2><button class="action" type="button" aria-label="Play Tears of Steel" title="Play video" data-play-row><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"></path></svg></button></div><div class="metadata"><span class="quality">1080p</span><span>182 MB</span><span class="duration">12:14</span></div><div class="status"><span class="saved-mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>Saved</span><span class="eta">· today</span></div></div>
      </article>
      <article class="video-row" data-state="queued">
        <button class="preview" type="button" aria-label="Preview Big Buck Bunny"><img src="/apps/extension/popup/media/big-buck-bunny.jpg" alt="Big Buck Bunny"><video muted loop playsinline preload="none" data-src="/apps/extension/popup/media/big-buck-bunny.mp4" aria-hidden="true"></video></button>
        <div class="copy"><div class="title-line"><h2>Big Buck Bunny</h2></div><div class="metadata"><span class="quality">720p</span><span>650 MB</span><span class="duration">9:56</span></div><div class="status"><span>Waiting</span><span class="eta">· starts next</span></div></div>
      </article>
    </section>
    <footer class="footer"><div class="footer-left"><span>No video?</span></div><button class="footer-button" type="button" id="open-app">Open VidSnag<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7"></path></svg></button></footer>
  </main>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
  <script>
    (() => {
      const featured = document.getElementById('featured');
      const status = document.getElementById('featured-status');
      const action = document.getElementById('featured-action');
      const announcement = document.getElementById('announcement');
      const mediaPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const design = { progress:42, state:'downloading', motion:true };
      let currentPreview = null;
      const pauseIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>';
      const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"></path></svg>';
      function stopPreview() {
        if (!currentPreview) return;
        currentPreview.querySelector('video').pause();
        currentPreview.classList.remove('is-playing');
        currentPreview = null;
      }
      function playPreview(button, explicit = false) {
        if ((!design.motion || mediaPreference.matches) && !explicit) return;
        if (currentPreview !== button) stopPreview();
        currentPreview = button;
        const video = button.querySelector('video');
        if (!video.src) video.src = video.dataset.src;
        video.muted = true;
        video.play().then(() => { if (currentPreview === button) button.classList.add('is-playing'); else video.pause(); }).catch(() => {});
      }
      document.querySelectorAll('.preview').forEach(button => {
        button.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') playPreview(button); });
        button.addEventListener('pointerleave', () => { if (document.activeElement !== button && currentPreview === button) stopPreview(); });
        button.addEventListener('focus', () => playPreview(button));
        button.addEventListener('blur', () => { if (currentPreview === button) stopPreview(); });
        button.addEventListener('click', () => { if (currentPreview === button && !button.querySelector('video').paused) stopPreview(); else playPreview(button, true); });
      });
      function render() {
        const percent = design.state === 'saved' ? 100 : Math.round(design.progress);
        const motion = design.motion && !mediaPreference.matches;
        [document.body,featured].forEach(element => { element.dataset.progress = String(percent); element.dataset.state = design.state; element.dataset.motion = String(motion); });
        featured.style.setProperty('--progress', percent + '%');
        const rail = featured.querySelector('.rail');
        rail.setAttribute('aria-valuenow', String(percent));
        rail.setAttribute('aria-valuetext', design.state === 'paused' ? 'Paused at ' + percent + ' percent' : percent + ' percent');
        if (design.state === 'saved') status.innerHTML = '<span class="saved-mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>Saved</span><span class="eta">· just now</span>';
        else if (design.state === 'paused') status.innerHTML = '<strong>' + percent + '%</strong><span class="eta">· Paused</span>';
        else status.innerHTML = '<strong>' + percent + '%</strong><span class="eta">· ' + (percent >= 85 ? 'under a minute' : '3 min left') + '</span>';
        const label = design.state === 'saved' ? 'Play video' : design.state === 'paused' ? 'Resume download' : 'Pause download';
        action.setAttribute('aria-label', label);
        action.title = label;
        action.innerHTML = design.state === 'downloading' ? pauseIcon : playIcon;
        if (!motion) stopPreview();
      }
      action.addEventListener('click', () => {
        if (design.state === 'saved') { playPreview(featured.querySelector('.preview'), true); return; }
        design.state = design.state === 'paused' ? 'downloading' : 'paused';
        render();
        announcement.textContent = design.state === 'paused' ? 'Example download paused.' : 'Example download resumed.';
      });
      document.querySelector('[data-play-row]').addEventListener('click', event => playPreview(event.currentTarget.closest('.video-row').querySelector('.preview'), true));
      document.getElementById('open-app').addEventListener('click', () => { announcement.textContent = 'Concept preview: this action opens the desktop app.'; });
      window.addEventListener('message', event => {
        const data = event.data;
        if (!data || data.type !== 'vidsnag-design-state') return;
        if (Number.isFinite(data.progress)) design.progress = Math.max(0,Math.min(100,data.progress));
        if (['downloading','paused','saved'].includes(data.state)) design.state = data.state;
        if (typeof data.motion === 'boolean') design.motion = data.motion;
        render();
      });
      mediaPreference.addEventListener('change',render);
      document.addEventListener('visibilitychange', () => { if (document.hidden) stopPreview(); });
      render();
    })();
  </script>
</body>
</html>
