<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SnagThis public test stream</title></head>
<body style="background:#121316;color:#eee;font:16px system-ui;padding:24px"><h1>Public developer test stream</h1><video controls muted width="640"></video><script src="/vendor/hls.min.js"></script><script>
const source = new URLSearchParams(location.search).get('url');
const video = document.querySelector('video');
if (source && /^https?:/.test(source)) {
  if (/\.m3u8(?:\?|$)/i.test(source) && Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 8 }); hls.loadSource(source); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  } else { video.src = source; video.play().catch(() => {}); }
}
</script></body></html>
